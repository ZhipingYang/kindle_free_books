<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的书架 · Kindle 藏书阁</title>
  <meta name="description" content="您的本地专属书房。自动记录阅读进度，支持一键加入收藏、离线无网畅读、本地电子书文件导入与管理。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css?v=20260909b">
  <link rel="stylesheet" href="assets/css/bookshelf.css?v=20260909a">
  <meta name="theme-color" content="#f8fafc">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="container navbar-inner">
      <div class="navbar-top-row">
        <a href="index.html" class="brand" title="返回藏书阁首页">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
          </div>
          <span class="brand-title">Kindle 藏书阁</span>
        </a>

        <div class="nav-tools">
          <a href="index.html" class="btn-icon mobile-nav-shortcut" title="返回藏书阁" aria-label="返回藏书阁">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </a>
          <button id="nav-upload-btn" class="btn-icon" title="导入本地电子书 (.epub / .mobi / .txt)" aria-label="Import Book">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </button>
          <input type="file" id="local-book-input" accept=".epub,.mobi,.prc,.azw,.txt" style="display: none;">

          <button id="theme-toggle-btn" class="btn-icon" title="切换暗黑/明亮模式" aria-label="Toggle Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <a href="https://github.com/ZhipingYang/kindle_free_books" target="_blank" rel="noopener noreferrer" class="btn-icon" title="访问 GitHub 开源项目" aria-label="GitHub Repository">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- Center Page Navigation -->
      <nav class="nav-links">
        <a href="index.html" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>藏书阁首页</span>
        </a>
        <a href="bookshelf.html" class="nav-link active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>我的书架</span>
          <span class="shelf-badge" id="shelf-count-badge">0</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Bookshelf Main -->
  <main class="container">
    <!-- Bookshelf Hero & Stats -->
    <section class="bookshelf-hero">
      <div class="bookshelf-header">
        <div class="bookshelf-title-group">
          <h1>⭐ 我的私人书房</h1>
          <p>阅读进度自动记忆，离线无网顺畅阅读。数据均安全留存在当前浏览器中。</p>
        </div>
      </div>

      <div class="bookshelf-stats">
        <div class="bs-stat-card">
          <div class="bs-stat-icon">⭐</div>
          <div class="bs-stat-info">
            <span class="bs-stat-val" id="stat-favs">0</span>
            <span class="bs-stat-lbl">书架收藏</span>
          </div>
        </div>

        <div class="bs-stat-card">
          <div class="bs-stat-icon">📖</div>
          <div class="bs-stat-info">
            <span class="bs-stat-val" id="stat-history">0</span>
            <span class="bs-stat-lbl">阅读进度</span>
          </div>
        </div>

        <div class="bs-stat-card">
          <div class="bs-stat-icon">💾</div>
          <div class="bs-stat-info">
            <span class="bs-stat-val" id="stat-cached">0</span>
            <span class="bs-stat-lbl">离线可用</span>
          </div>
        </div>

        <div class="bs-stat-card">
          <div class="bs-stat-icon">📥</div>
          <div class="bs-stat-info">
            <span class="bs-stat-val" id="stat-custom">0</span>
            <span class="bs-stat-lbl">本地导入</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Bookshelf Toolbar & Tabs -->
    <div class="bookshelf-toolbar-wrap">
      <div class="bookshelf-tabs">
        <button id="tab-favs-btn" class="bs-tab-btn active">
          <span>⭐ 收藏书籍</span>
          <span class="bs-tab-count" id="tab-favs-count">0</span>
        </button>

        <button id="tab-history-btn" class="bs-tab-btn">
          <span>🕒 阅读记录</span>
          <span class="bs-tab-count" id="tab-history-count">0</span>
        </button>

        <button id="tab-cached-btn" class="bs-tab-btn">
          <span>💾 离线可用</span>
          <span class="bs-tab-count" id="tab-cached-count">0</span>
        </button>

        <button id="tab-custom-btn" class="bs-tab-btn">
          <span>📥 本地导入</span>
          <span class="bs-tab-count" id="tab-custom-count">0</span>
        </button>
      </div>

      <div class="bookshelf-filter-row">
        <div class="bs-search-box">
          <svg class="bs-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="bs-search-input" class="bs-search-input" placeholder="在我的书架中检索..." autocomplete="off">
        </div>

        <div class="bs-actions-group">
          <button id="clear-history-btn" class="btn btn-secondary" style="display: none; padding: 0.45rem 0.8rem; font-size: 0.82rem;" title="清空全部阅读历史">
            🗑 清空阅读记录
          </button>

          <div class="view-toggle">
            <button id="view-grid-btn" class="view-btn active" title="网格卡片视图" aria-label="Grid View">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
            <button id="view-list-btn" class="view-btn" title="列表表格视图" aria-label="List View">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Books Grid/List Content -->
    <section id="bookshelf-container" style="min-height: 400px; margin-bottom: 3rem;"></section>
  </main>

  <!-- Book Detail Drawer Modal (Slide-over & Mobile Bottom Sheet) -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="book-drawer" class="drawer" aria-modal="true" role="dialog" aria-label="图书详情">
    <div class="drawer-header">
      <div class="drawer-header-title">📖 书籍详细档案</div>
      <button id="drawer-close-btn" class="btn-icon" style="width: 2rem; height: 2rem;" title="关闭详情 (Esc)" aria-label="Close">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
    <div class="drawer-footer">
      <button id="drawer-read-btn" class="btn btn-read" style="flex: 1.4;">📖 立即在线阅读</button>
      <a id="drawer-download-btn" href="#" class="btn btn-primary" style="flex: 1;" download>📥 高速下载</a>
      <button id="drawer-copy-btn" class="btn btn-secondary" style="flex: 0.8;" title="复制直达链接">🔗 直链</button>
    </div>
  </aside>


  <!-- Toast Shelf -->
  <div id="toast-shelf" class="toast-shelf"></div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>Kindle Free Books 藏书阁 · 私人专属书房</p>
      <p style="margin-top: 0.35rem; font-size: 0.8rem;">
        已启用 LocalStorage 进度自动持久化与 IndexedDB 离线全书缓存，刷新与重启无缝续读。
      </p>
    </div>
  </footer>

  <!-- Bookshelf page scripts -->
  <script src="assets/js/config.js?v=20260909"></script>
  <script src="assets/js/reader/db.js"></script>
  <script src="assets/js/modules/store.js"></script>
  <script src="assets/js/modules/ui.js?v=20260909b"></script>
  <script src="assets/js/pages/bookshelf.js?v=20260909b"></script>
</body>
</html>
