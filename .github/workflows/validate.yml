name: Validate library

on:
  pull_request:
  push:
    branches: [master]

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog, duplicates, and file sizes
        run: |
          python scripts/update_books.py --check
          python scripts/audit_library.py --max-file-mb 50
